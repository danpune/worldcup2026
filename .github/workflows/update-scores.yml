name: Update World Cup scores

# The tournament finished on 19 July 2026, so there is nothing left to poll. The 10-minute
# cron kept running into August: it burned Actions minutes, added ~144 commits a day, and on
# 6 Aug ESPN began 403-ing CI runners — the partial fetch then rewrote scores.json WITHOUT the
# semifinals and final, wiping the champion from the live site, while the churn caused rebase
# conflicts and queue-cancelled runs (the "All jobs were cancelled" emails).
# NOTE: this workflow is also DISABLED in the Actions tab (gh workflow disable). Removing the
# cron alone was not enough - something outside this repo kept dispatching it every 10 minutes
# (real cron runs report event "schedule"; these reported "workflow_dispatch"). Disabling blocks
# dispatch too. Re-enable with:  gh workflow enable "Update World Cup scores"
# ...and restore the schedule below, only for a future tournament.
on:
  workflow_dispatch:           # manual runs only, from the Actions tab

permissions:
  contents: write              # needed to commit scores.json

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job otherwise runs to GitHub's 360-minute default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (SHA-pinned)

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"

      - name: Fetch scores from the worker feed
        run: python fetch_scores.py

      - name: Commit if scores changed
        run: |
          git config user.name  "scores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scores.json
          git diff --staged --quiet || git commit -m "Update scores $(date -u +%FT%TZ)"
          # scores.json is generated, so a concurrent update is not a real conflict:
          # keep the copy this run just produced instead of failing the job.
          git pull --rebase origin main || {
            git checkout --ours scores.json
            git add scores.json
            GIT_EDITOR=true git rebase --continue
          }
          git push
