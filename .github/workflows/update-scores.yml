name: Update World Cup scores

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC). GitHub may delay a few min under load.
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: write              # needed to commit scores.json

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch scores from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch_scores.py

      - name: Commit if scores changed
        run: |
          git config user.name  "scores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scores.json
          git diff --staged --quiet || git commit -m "Update scores $(date -u +%FT%TZ)"
          git push
