<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1200px;height:630px;overflow:hidden}
 body{
  font-family:Inter,system-ui,sans-serif;
  background:
   radial-gradient(900px 500px at 85% -10%, rgba(232,184,75,.18), transparent 60%),
   radial-gradient(700px 600px at 5% 120%, rgba(18,86,64,.9), transparent 55%),
   linear-gradient(155deg,#0A1F18 0%,#0B3D2E 70%,#125640 100%);
  color:#fff;position:relative;
  border-top:10px solid #E8B84B;
 }
 .pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:center}
 .kick{font-family:Oswald,Impact,sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.28em;font-size:30px;color:#E8B84B;margin-bottom:18px}
 h1{font-family:Oswald,Impact,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:150px;line-height:.92;letter-spacing:.01em;color:#fff;
  text-shadow:0 3px 24px rgba(0,0,0,.35)}
 .sub{font-family:Inter,sans-serif;font-weight:500;font-size:33px;color:#cfe3d8;margin-top:26px;line-height:1.3}
 .sub b{color:#fff;font-weight:600}
 .row{display:flex;align-items:center;gap:18px;margin-top:40px}
 .flags{font-size:56px;line-height:1}
 .pill{font-family:Oswald,sans-serif;font-weight:500;font-size:26px;letter-spacing:.04em;
  background:rgba(255,255,255,.10);border:1px solid rgba(232,184,75,.5);border-radius:999px;
  padding:12px 24px;color:#f3e2b4;white-space:nowrap}
 .ball{position:absolute;right:60px;bottom:48px;font-size:150px;opacity:.16;transform:rotate(-8deg)}
</style>
</head>
<body>
 <div class="ball">⚽</div>
 <div class="pad">
  <div class="kick">USA · Canada · Mexico</div>
  <h1>World Cup<br>2026</h1>
  <div class="sub"><b>Live scores</b> · standings that update in real time · every match in <b>your timezone</b></div>
  <div class="row">
   <span class="flags">🇺🇸 🇨🇦 🇲🇽</span>
   <span class="pill">June 11 – July 19</span>
   <span class="pill">104 matches</span>
  </div>
 </div>
</body>
</html>
